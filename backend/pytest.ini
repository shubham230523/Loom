[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
env =
    ENVIRONMENT=test
    DATABASE_URL=postgresql+asyncpg://loom:loom@localhost:5432/loom_test
    REDIS_URL=redis://localhost:6379/1
    SECRET_KEY=test-secret-key-123
