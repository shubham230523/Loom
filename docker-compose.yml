services:
  db:
    image: pgvector/pgvector:pg16
    container_name: loom-db
    restart: always
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - loom-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: loom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - loom-redis-data:/data

volumes:
  loom-db-data:
  loom-redis-data:
